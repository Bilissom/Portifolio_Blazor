<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alisson Caio — Desenvolvedor Front-End. Portifólio pessoal com projetos, habilidades e contato." />
    <meta name="keywords" content="desenvolvedor front-end, react, blazor, css, javascript, portifólio" />
    <meta name="author" content="Alisson Caio" />
    <meta property="og:title" content="Alisson Caio | Desenvolvedor Front-End" />
    <meta property="og:description" content="Portifólio de Alisson Caio — Desenvolvedor Front-End explorando as profundezas do código." />
    <meta property="og:type" content="website" />
    <title>Alisson Caio | Desenvolvedor Front-End</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="AliPortifolio.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="
            position:fixed; inset:0;
            background:#0a0a0f;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            font-family:'Cinzel',serif;
        ">
            <svg width="80" height="80" viewBox="0 0 80 80" style="margin-bottom:1.5rem">
                <circle cx="40" cy="40" r="35" fill="none" stroke="#2a2a3d" stroke-width="4"/>
                <circle cx="40" cy="40" r="35" fill="none" stroke="#6db5e8" stroke-width="4"
                    stroke-dasharray="0 500"
                    style="transform-origin:50% 50%;transform:rotate(-90deg);
                    transition:stroke-dasharray 0.3s ease;">
                </circle>
                <!-- Knight Eyes -->
                <ellipse cx="32" cy="38" rx="5" ry="6" fill="#6db5e8" opacity="0.9"/>
                <ellipse cx="48" cy="38" rx="5" ry="6" fill="#6db5e8" opacity="0.9"/>
                <ellipse cx="33" cy="37" rx="2" ry="3" fill="#0a0a0f"/>
                <ellipse cx="49" cy="37" rx="2" ry="3" fill="#0a0a0f"/>
            </svg>
            <div style="color:#b0b0c0;font-size:0.8rem;letter-spacing:0.3em;text-transform:uppercase;animation:pulse 2s ease-in-out infinite;">
                Carregando...
            </div>
            <div style="color:#3a3a55;font-size:0.65rem;letter-spacing:0.2em;margin-top:0.5rem;text-transform:uppercase;">
                Entrando em Hallownest
            </div>
            <style>
                @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
